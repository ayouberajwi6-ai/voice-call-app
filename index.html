<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Call</title>

  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.24.2.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111827;
      color: white;
      padding: 30px;
    }

    h1 {
      margin-bottom: 30px;
    }

    input {
      width: 90%;
      max-width: 400px;
      padding: 14px;
      margin: 8px;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 14px 25px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
    }

    button:disabled {
      background: #555;
    }

    #status {
      margin-top: 20px;
      color: #22c55e;
    }
  </style>
</head>

<body>

  <h1>📞 Voice Call</h1>

  <input id="channel" placeholder="اسم الغرفة" value="room1">

  <br>

  <button id="join">دخول المكالمة</button>
  <button id="leave" disabled>خروج</button>

  <div id="status">جاهز للاتصال</div>

  <script>
    const APP_ID = "ضع_APP_ID_هنا";

    let client = AgoraRTC.createClient({
      mode: "rtc",
      codec: "vp8"
    });

    let localAudioTrack = null;

    const joinButton = document.getElementById("join");
    const leaveButton = document.getElementById("leave");
    const status = document.getElementById("status");

    joinButton.onclick = async () => {
      try {
        const channel = document.getElementById("channel").value;

        if (!channel) {
          alert("اكتب اسم الغرفة");
          return;
        }

        await navigator.mediaDevices.getUserMedia({
          audio: true
        });

        await client.join(
          APP_ID,
          channel,
          null,
          null
        );

        localAudioTrack =
          await AgoraRTC.createMicrophoneAudioTrack();

        await client.publish([localAudioTrack]);

        status.innerText = "🟢 أنت داخل المكالمة";

        joinButton.disabled = true;
        leaveButton.disabled = false;

      } catch (error) {
        console.error(error);
        status.innerText = "❌ حدث خطأ: " + error.message;
      }
    };

    client.on("user-published", async (user, mediaType) => {
      await client.subscribe(user, mediaType);

      if (mediaType === "audio") {
        user.audioTrack.play();
      }
    });

    client.on("user-unpublished", (user) => {
      console.log("المستخدم غادر الصوت");
    });

    leaveButton.onclick = async () => {
      if (localAudioTrack) {
        localAudioTrack.close();
      }

      await client.leave();

      status.innerText = "🔴 خرجت من المكالمة";

      joinButton.disabled = false;
      leaveButton.disabled = true;
    };
  </script>

</body>
</html>
